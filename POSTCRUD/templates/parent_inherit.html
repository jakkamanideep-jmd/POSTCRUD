<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block title %}    {% endblock %}</title>
    <style type="text/css">
        
        body
        {
            margin:0%;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;

        }   
        
        .navigation
        {
            background-color:#333 ;
            overflow: hidden;
        }

        a[class="login"],a[class="register"],a[class="logout"],a[class="account"],a[class="newpost"]

        {
         float:right;
         color:#f2f2f2;
         display:block;
         padding:14px 20px;
         text-align: center;
         text-decoration: none;

        }

        a[class="home"]
        {
         float: left;  
         color:#f2f2f2;
         display:block;
         padding:14px 20px;
         text-align: center;
         text-decoration: none;         
        }
        
        .para{
            width:300px;
            margin:auto;
        }
        .content
        {  
          width: 350px;
          margin-left:35%;
          margin-right: 50%;
          margin-top: 15px;
          border: 5px;
          padding: 0%;

        }
        
        .the_register
        {
            display: block;
            border:2px solid black;
            border-radius: 4px;    
            padding:10px 5px;
            text-align: center;
            
        }
        #submit
        {
            padding:5px;
            margin:4px;
        }
        .the_login
        {
            display: block;
            border:2px solid black;
            padding:10px 5px;
            text-align: center;            
        }
        
        #login
        {
            padding:5px;
            margin:5px;
            margin-top: 0px;
        }


    </style>
</head>
<body>
    <div class="navigation">
        {% if current_user.is_authenticated %}
            <a class="logout" href="{{url_for('users.logout')}}">logout</a>
            <a class="account" href="{{url_for('users.account')}}">account</a>
            <a class="newpost" href="{{url_for('posts.new_post')}}">NewPost</a>
            <a class="home" href="{{url_for('main.home')}}">home</a>
            <a class="chatbot" href="{{url_for('users.chatbot')}}">chathelp</a>

        {% else %}

            <a class="home" href="{{url_for('main.home')}}">home</a>
            <a class="login" href="{{url_for('users.login')}}">login</a>
            <a class="register" href="{{url_for('users.register')}}">register</a>
        {% endif %}    
    </div>
    <div class="content">
    {% block content %}
    {% endblock %}
    </div>
</body>
</html>
