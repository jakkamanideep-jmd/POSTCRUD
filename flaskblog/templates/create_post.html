{% extends "parent_inherit.html" %}

{% block title %}
 {{title}}

{% endblock %}

{% block content %}
<div>
<form action="{{url_for('posts.new_post')}}" method="post">
{{form.hidden_tag()}}
<legend>{{legend}}</legend>
<table>
<tr>
    <td>{{form.title.label}}</td><td>{{form.title()}}</td>
</tr>
<tr>
    <td>{{form.content.label}}</td><td>{{form.content()}}</td>

</tr>
</table>
{{form.submit()}}        
</form>
</div>
{% endblock %}
